name: Remote login terminal
description: Attach a browser terminal to `az login --use-device-code` on this runner

inputs:
  session_id:
    required: true
    description: "Terminal session id the browser registered before dispatching this run"
  webpubsub_endpoint:
    required: true
    description: "Web PubSub host, e.g. zenme-azure-remote-login.webpubsub.azure.com"
  webpubsub_client_id:
    required: true
    description: "App registration holding Web PubSub Service Owner on that resource"
  webpubsub_tenant_id:
    required: true
    description: "Tenant that owns the Web PubSub resource"
  hub_name:
    required: false
    default: "terminal"
    description: "Hub the session group lives in"
  session_ttl:
    required: false
    default: "1800"
    description: "Seconds the session may stay open"
  tenant_id:
    required: false
    default: ""
    description: "Tenant the user signs in to; blank uses their home tenant"
  subscription_id:
    required: false
    default: ""
    description: "Subscription to select after login; blank leaves whichever one az defaulted to"
  aws_region:
    required: false
    default: "us-east-1"
    description: "Region the AWS sign-in runs against"
  dir:
    required: true
    description: "Stage directory the plan was produced for"
  plan_run_id:
    required: true
    description: "The plan run whose tfplan to apply"
  github_token:
    required: true
    description: "Token used to download the planned stage and record the deployment"
  environment:
    required: false
    default: ""
    description: "GitHub Environment the deployment is recorded against"
  ref:
    required: false
    default: ""
    description: "Branch the deployment is recorded against"
  plan_file:
    required: false
    default: "tfplan"
    description: "Plan filename inside the stage package"
  terraform_version:
    required: false
    default: "1.6.6"
    description: "Must stay compatible with the version that produced the plan"

runs:
  using: composite
  steps:
    - name: Read the clouds this stage needs
      id: clouds
      uses: ./.github/actions/read-terraform-providers
      with:
        stage_dir: corpSetup/${{ inputs.dir }}

    - name: Check the plan is still the current one
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        DIR: ${{ inputs.dir }}
        ENVIRONMENT: ${{ inputs.environment }}
        PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      run: |
        # Fetch the latest deployment for this environment and stage
        LATEST=$(gh api \
          "/repos/${{ github.repository }}/deployments?environment=$ENVIRONMENT&task=plan:$DIR&per_page=1" \
          --jq '.[0].payload | if type == "string" then fromjson else . end | .runId // empty')

        fail() {
          echo "::error::$1"
          { echo "$1"; echo; echo "$2"; } > /tmp/deploy_output.txt
          exit 1
        }

        if [ -z "$LATEST" ]; then
          fail "No plan report for $DIR in $ENVIRONMENT — cannot confirm the plan is current." \
               "Run the plan for this stage first, then deploy."
        fi
        if [ "$LATEST" != "$PLAN_RUN_ID" ]; then
          fail "Refusing to apply a superseded plan: asked for run $PLAN_RUN_ID, current is $LATEST." \
               "$DIR was re-planned after the card loaded. Refresh the stage and deploy again so the apply matches the changes that were reviewed."
        fi

        echo "Plan run $PLAN_RUN_ID is current for $DIR."

    - uses: pnpm/setup@v2
      with:
        runtime: node@^24.22.1
        install: false

    - name: Install the agent's dependencies
      id: deps
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install

    - name: Sign in to the tenant that owns the Web PubSub
      id: az_login
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.webpubsub_client_id }}
        tenant-id: ${{ inputs.webpubsub_tenant_id }}
        allow-no-subscriptions: true

    - name: Mint the Web PubSub client URL
      id: mint
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node mint-webpubsub-token.js
      env:
        SESSION_ID: ${{ inputs.session_id }}
        WEBPUBSUB_ENDPOINT: ${{ inputs.webpubsub_endpoint }}
        WEBPUBSUB_TENANT_ID: ${{ inputs.webpubsub_tenant_id }}
        HUB_NAME: ${{ inputs.hub_name }}
        SESSION_TTL: ${{ inputs.session_ttl }}

    - name: Clear cached Azure credentials
      shell: bash
      run: |
        az logout 2>/dev/null || true
        rm -rf ~/.azure 2>/dev/null || true

    - name: Skip the interactive subscription picker
      shell: bash
      run: az config set core.login_experience_v2=off

    - name: Attach the terminal and run the device login
      id: login
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node agent.js
      env:
        SESSION_ID: ${{ inputs.session_id }}
        AZURE_TENANT_ID: ${{ inputs.tenant_id }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
        AWS_LOGIN: ${{ steps.clouds.outputs.needs_aws }}
        AWS_REGION: ${{ inputs.aws_region }}

    # TODO: confirm !cancelled() behaves as intended on a real cancel
    # ── Deploy ────────────────────────────────────────────────────────────────
    - name: Download the planned stage
      id: download
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.dir }}-pkg
        path: stage
        run-id: ${{ inputs.plan_run_id }}
        github-token: ${{ inputs.github_token }}

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Apply the reviewed plan as the signed-in user
      id: apply
      shell: bash
      working-directory: stage
      env:
        PLAN_FILE: ${{ inputs.plan_file }}
        TF_IN_AUTOMATION: "true"
        ARM_USE_CLI: "true"
      run: |
        # The artifact round-trip drops the exec bit off the provider binaries.
        find .terraform/providers -name "terraform-provider-*" -type f -exec chmod +x {} \; 2>/dev/null || true
        terraform init 2>&1 | tee /tmp/deploy_output.txt
        terraform apply -auto-approve "$PLAN_FILE" 2>&1 | tee -a /tmp/deploy_output.txt

    - name: Note the cancellation
      id: cancel
      if: cancelled()
      shell: bash
      run: echo "cancelled=true" >> $GITHUB_OUTPUT

    - name: Make sure the log explains itself
      if: ${{ !cancelled() }}
      shell: bash
      env:
        DEPS: ${{ steps.deps.outcome }}
        AZ_LOGIN: ${{ steps.az_login.outcome }}
        MINT: ${{ steps.mint.outcome }}
        LOGIN: ${{ steps.login.outcome }}
        DOWNLOAD: ${{ steps.download.outcome }}
        APPLY: ${{ steps.apply.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        [ -s /tmp/deploy_output.txt ] && exit 0

        for pair in "DEPS:Installing the agent's dependencies" \
                    "AZ_LOGIN:Signing in to mint the relay token" \
                    "MINT:Minting the Web PubSub client URL" \
                    "LOGIN:The interactive sign-in" \
                    "DOWNLOAD:Downloading the planned stage" \
                    "APPLY:Applying the plan"; do
          var=${pair%%:*}
          if [ "${!var}" = "failure" ]; then
            { echo "${pair#*:} failed."; echo; echo "Full output: $RUN_URL"; } > /tmp/deploy_output.txt
            exit 0
          fi
        done

        { echo "The deploy did not complete."; echo; echo "Full output: $RUN_URL"; } > /tmp/deploy_output.txt

    - name: Upload the apply log
      if: ${{ !cancelled() }}
      id: log
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.dir }}-deploy-log
        path: /tmp/deploy_output.txt
        if-no-files-found: ignore

    - name: Build the deployment payload
      if: always()
      id: payload
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        OUTCOME: ${{ steps.apply.outcome }}
        CANCELLED: ${{ steps.cancel.outputs.cancelled }}
        PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        LOG_ID: ${{ steps.log.outputs.artifact-id }}
        LOG_URL: ${{ steps.log.outputs.artifact-url }}
      run: |
        if [ "$CANCELLED" = "true" ]; then
          STATUS=cancelled
        elif [ "$OUTCOME" = "success" ]; then
          STATUS=success
        else
          STATUS=failed
        fi
        PAYLOAD=$(jq -nc \
          --arg stage "$DIR" --arg status "$STATUS" \
          --arg deployRunId "${{ github.run_id }}" --arg deployLogUrl "$LOG_URL" \
          --arg deployPlanRunId "$PLAN_RUN_ID" \
          --argjson deployedAt "$(date +%s)" --argjson deployLogId "${LOG_ID:-null}" \
          '{ stage: $stage, deployStatus: $status, deployRunId: $deployRunId,
             deployPlanRunId: $deployPlanRunId, deployedAt: $deployedAt,
             deployLogId: $deployLogId, deployLogUrl: $deployLogUrl }')
        echo "payload=$PAYLOAD" >> $GITHUB_OUTPUT
        echo "state=$([ "$STATUS" = success ] && echo success || echo failure)" >> $GITHUB_OUTPUT
        echo "$STATUS"
        echo "$PAYLOAD"

    # task=deploy:<dir> is exactly what the card queries the Deployments API for.
    - name: Record the deployment
      if: always()
      uses: ./.github/actions/record-deployment
      with:
        github_token: ${{ inputs.github_token }}
        environment: ${{ inputs.environment }}
        ref: ${{ inputs.ref }}
        kind: deploy
        dir: ${{ inputs.dir }}
        state: ${{ steps.payload.outputs.state }}
        payload: ${{ steps.payload.outputs.payload }}
        log_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
