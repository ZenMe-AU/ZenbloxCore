# DEPRECATED
name: Deploy changeset

on:
    workflow_dispatch:
        inputs:
            run_id:
                required: true
                description: "planChanges run ID"
            dir:
                required: true
                description: "Stage directory name (e.g. c01subscription)"
            github_env_name:
                required: false
                description: "GitHub Environment name"

permissions:
    id-token: write
    contents: write
    actions: read

env:
    BRANCH: ${{ github.ref_name }}
    DEPLOYMENT_CHANGESET_PATH: corpSetup/deploymentChangeset.json

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.github_env_name }}

        steps:
            - name: Checkout changeset
              uses: actions/checkout@v4
              with:
                  sparse-checkout: ${{ env.DEPLOYMENT_CHANGESET_PATH }}
                  sparse-checkout-cone-mode: false
                  fetch-depth: 0

            - name: Check run ID
              shell: bash
              run: |
                  CHANGESET_RUN_ID=$(jq -r '.runId' ${{ env.DEPLOYMENT_CHANGESET_PATH }})

                  if [ "$CHANGESET_RUN_ID" != "${{ inputs.run_id }}" ]; then
                    echo "run_id mismatch: changeset has '$CHANGESET_RUN_ID', input is '${{ inputs.run_id }}'"
                    exit 1
                  fi

                  echo "run_id validated: $CHANGESET_RUN_ID"

            - name: Download pkg artifact
              uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.dir }}-pkg
                  path: stage
                  run-id: ${{ inputs.run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.6
                  terraform_wrapper: false

            - name: Azure Login
              id: az_login
              continue-on-error: true
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: AWS Login
              id: aws_login
              continue-on-error: true
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Set Terraform env
              if: steps.az_login.outcome == 'success'
              shell: bash
              run: |
                  echo "ARM_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
                  echo "ARM_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" >> $GITHUB_ENV
                  echo "ARM_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
                  echo "ARM_USE_OIDC=true" >> $GITHUB_ENV

            - name: Terraform apply
              id: tf_apply
              continue-on-error: true
              working-directory: stage
              shell: bash
              run: |
                  find .terraform/providers -name "terraform-provider-*" -type f -exec chmod +x {} \; 2>/dev/null || true
                  terraform init > /tmp/tf_output.txt 2>&1
                  terraform apply -auto-approve tfplan >> /tmp/tf_output.txt 2>&1

            - name: Print apply log
              if: always()
              shell: bash
              run: cat /tmp/tf_output.txt

            - name: Upload deploy log
              id: upload_log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  if-no-files-found: ignore
                  name: ${{ inputs.dir }}-deploy-log
                  path: /tmp/tf_output.txt

            - name: Update deployment status
              if: always()
              shell: bash
              run: |
                  TS=$(date +%s)
                  STATUS=${{ steps.tf_apply.outcome == 'success' && '"success"' || '"failed"' }}
                  LOG_ID="${{ steps.upload_log.outputs.artifact-id }}"
                  LOG_URL="${{ steps.upload_log.outputs.artifact-url }}"

                  jq \
                    --arg dir "${{ inputs.dir }}" \
                    --arg status "$STATUS" \
                    --arg deployRunId "${{ github.run_id }}" \
                    --arg deployPlanRunId "${{ inputs.run_id }}" \
                    --argjson deployedAt "$TS" \
                    --argjson deployLogId "${LOG_ID:-null}" \
                    --arg deployLogUrl "$LOG_URL" \
                    '.stages = [.stages[] | if .name == $dir then . + {
                      deployStatus: $status,
                      deployRunId: $deployRunId,
                      deployPlanRunId: $deployPlanRunId,
                      deployedAt: $deployedAt,
                      deployLogId: $deployLogId,
                      deployLogUrl: (if $deployLogUrl == "" then null else $deployLogUrl end)
                    } else . end]' $DEPLOYMENT_CHANGESET_PATH > /tmp/updated_changeset.json

                  mv /tmp/updated_changeset.json $DEPLOYMENT_CHANGESET_PATH

            - name: Commit results
              if: always()
              shell: bash
              run: |
                  _NAME="${{ vars.NAME }}"
                  GIT_NAME="${_NAME:+$_NAME }github actions"
                  GIT_EMAIL="${GIT_NAME// /_}@${{ vars.DNS }}"
                  git config user.name "$GIT_NAME"
                  git config user.email "$GIT_EMAIL"

                  git add $DEPLOYMENT_CHANGESET_PATH
                  git diff --cached --quiet || git commit -m "Update deploy status: ${{ inputs.dir }}"

                  git fetch origin
                  git rebase -X ours origin/$BRANCH || {
                    echo "Rebase failed"
                    exit 1
                  }
                  git push origin $BRANCH
