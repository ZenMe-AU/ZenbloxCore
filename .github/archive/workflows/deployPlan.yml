# DEPRECATED
name: Deploy a planned stage

# One file for every stage, unlike the plan side: applying a tfplan is the same operation whatever
# produced it, so there is no stage-specific logic here to keep apart.
on:
  workflow_dispatch:
    inputs:
      dir:
        required: true
        description: "Stage directory (e.g. c01subscription)"
      plan_run_id:
        required: true
        description: "The plan run whose tfplan to apply"
      github_env_name:
        required: false
        description: "GitHub Environment name"

permissions:
  contents: read
  id-token: write
  actions: read

# The deploy job reads the changeset to validate the run, the commit job writes the result back —
# one declaration so the two cannot end up pointing at different files.
env:
  BRANCH: ${{ github.ref_name }}
  CHANGESET_PATH: corpSetup/deploymentChangeset.json
  # Must match PLAN_FILE in the plan workflow — this is the file that one produced.
  PLAN_FILE: tfplan
  # Must stay compatible with TERRAFORM_VERSION in the plan workflow.
  TERRAFORM_VERSION: 1.6.6

jobs:
  deploy:
    environment: ${{ inputs.github_env_name }}
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.deploy.outputs.deploy_status }}
      log_id: ${{ steps.deploy.outputs.log_id }}
      log_url: ${{ steps.deploy.outputs.log_url }}
    steps:
      - uses: actions/checkout@v5
      - id: deploy
        uses: ./.github/actions/deploy-stage
        with:
          dir: ${{ inputs.dir }}
          plan_run_id: ${{ inputs.plan_run_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changeset_path: ${{ env.CHANGESET_PATH }}
          plan_file: ${{ env.PLAN_FILE }}
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}

  # Separate job so the card still learns the outcome when the deploy job dies outright — a bad
  # run_id or a failed login never reaches the apply step.
  commit:
    concurrency:
      group: changeset-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    environment: ${{ inputs.github_env_name }}
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/commit-deploy-status
        with:
          dir: ${{ inputs.dir }}
          branch: ${{ env.BRANCH }}
          changeset_path: ${{ env.CHANGESET_PATH }}
          deploy_status: ${{ needs.deploy.outputs.deploy_status || 'failed' }}
          plan_run_id: ${{ inputs.plan_run_id }}
          log_id: ${{ needs.deploy.outputs.log_id }}
          log_url: ${{ needs.deploy.outputs.log_url }}
          corp_name: ${{ vars.NAME }}
          dns: ${{ vars.DNS }}
