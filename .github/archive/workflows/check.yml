# DEPRECATED
name: Check Service Principal

on:
    workflow_dispatch:

permissions:
    contents: read
    issues: write
    id-token: write

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Check required secrets
              shell: bash
              run: |
                  missing=0
                  [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] && echo "Missing AZURE_CLIENT_ID" && missing=1
                  [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && echo "Missing AZURE_TENANT_ID" && missing=1
                  [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && echo "Missing AZURE_SUBSCRIPTION_ID" && missing=1
                  if [ $missing -eq 1 ]; then
                    echo "Some required secrets are missing. Exiting."
                    exit 1
                  fi

            - name: Get or create config issue
              id: config
              shell: bash
              run: |
                  RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                    "https://api.github.com/repos/${{ github.repository }}/issues?state=open&per_page=100")

                  ISSUE=$(echo "$RESPONSE" | jq -c '.[] | select(.title=="config")' | head -n1)
                  NUMBER=$(echo "$ISSUE" | jq -r '.number')

                  if [ -z "$NUMBER" ] || [ "$NUMBER" == "null" ]; then
                    RESPONSE=$(curl -s -X POST \
                      -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                      -H "Accept: application/vnd.github+json" \
                      https://api.github.com/repos/${{ github.repository }}/issues \
                      -d '{"title":"config","body":"{}"}')
                    NUMBER=$(echo "$RESPONSE" | jq -r '.number')
                    BODY="{}"
                  else
                    BODY=$(echo "$ISSUE" | jq -r '.body')
                    echo "$BODY" | jq empty >/dev/null 2>&1 || BODY="{}"
                  fi

                  echo "ISSUE_NUMBER=$NUMBER" >> $GITHUB_ENV
                  echo "$BODY" > old_body.json

            - name: Login to Azure
              id: az_login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Check Service Principal and prepare update
              id: check_sp
              shell: bash
              run: |
                  set +e
                    SP_INFO=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" 2>/dev/null)
                    STATUS=$?
                  set -e

                  if [ "$STATUS" -eq 0 ]; then
                    SP_ID=$(echo "$SP_INFO" | jq -r '.appId')
                    SP_NAME=$(echo "$SP_INFO" | jq -r '.displayName')
                    SP_STATUS="VALID"
                  else
                    SP_ID=""
                    SP_NAME=""
                    SP_STATUS="NOT_FOUND_OR_UNAUTHORIZED"
                  fi

                  OLD_JSON=$(cat old_body.json)

                  UPDATED_BODY=$(jq -c \
                    --arg sp_name "$SP_NAME" \
                    --arg sp_id "$SP_ID" \
                    --arg sp_status "$SP_STATUS" \
                    '.sp_name=$sp_name | .sp_id=$sp_id | .sp_status=$sp_status' <<< "$OLD_JSON")

                  echo "$UPDATED_BODY" > updated_body.json

            - name: Update config issue
              shell: bash
              run: |
                  BODY_STRING=$(cat updated_body.json)

                  curl -s -X PATCH \
                    -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                    -H "Accept: application/vnd.github+json" \
                    https://api.github.com/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }} \
                    -d "{\"body\":$BODY_STRING}"
